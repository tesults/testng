name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - java: '11'
            testng_runtime: '6.10'
          - java: '11'
            testng_runtime: '7.12.0'
          - java: '17'
            testng_runtime: '7.12.0'
          - java: '21'
            testng_runtime: '7.12.0'

    steps:
      - uses: actions/checkout@v5
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - name: Build with TestNG ${{ matrix.testng_runtime }}
        run: ./gradlew clean test build -PtestngRuntimeVersion=${{ matrix.testng_runtime }}
