plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'com.vanniktech.maven.publish.base' version '0.35.0'
}

group 'com.tesults.testng'
version '1.3.0'

sourceCompatibility = 1.8

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.testng:testng:6.10'
    implementation 'com.tesults:tesults:1.0.3'
    implementation 'org.json:json:20171018'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

if (findProperty('testngRuntimeVersion')) {
    configurations.testRuntimeClasspath {
        resolutionStrategy.force "org.testng:testng:${property('testngRuntimeVersion')}"
        attributes.attribute(
                org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE,
                Integer.parseInt(JavaVersion.current().majorVersion)
        )
    }
}

processResources {
    filesMatching('com/tesults/testng/version.properties') {
        expand(projectVersion: project.version)
    }
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
                'Specification-Title': 'TestNG Tesults Plugin',
                'Specification-Version': project.version,
                'Specification-Vendor': 'Tesults',
                'Implementation-Title': 'com.tesults.testng',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Tesults'
        )
    }
}

java {
    withJavadocJar()
    withSourcesJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'tesults-testng'
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            pom {
                name = 'tesults-testng'
                description = 'Tesults TestNG Listener'
                url = 'https://www.tesults.com'
                licenses {
                    license {
                        name = "MIT"
                        url = "https://opensource.org/licenses/MIT"
                        distribution = "repo"
                    }
                }
                developers {
                    developer {
                        id = "ajeetd"
                        name = "Ajeet Dhaliwal"
                        email = "help@tesults.com"
                    }
                }

                scm {
                    url = "https://github.com/tesults/testng.git"
                }
            }
        }
    }
}

mavenPublishing {
    publishToMavenCentral()
    if (!gradle.startParameter.taskNames.any { it.toLowerCase().contains('mavenlocal') }) {
        signAllPublications()
    }
}

javadoc {
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}
